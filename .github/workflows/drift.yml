# Nightly drift check: plan main against what is really there, and fail
# when they differ. A change made by hand in GitHub, AWS or Cloudflare then
# fails CI the next morning, instead of sitting until the next infra pull
# request reverts it among its own changes.
#
#   schedule / manual run on main → plan with infra-plan (read-only) and
#   the infra-read App, -lock=false; exit 0 passes, 2 (drift) and 1
#   (error) fail. The plan is the job summary.
#
# Read-only, like the pull request's plan: no apply, no lock, no saved
# plan file (a plan holds sensitive values in the clear, and artifacts on
# a public repository are downloadable). The main root only; doppler/ is
# planned and applied by hand.

name: drift

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  AWS_REGION: us-east-1

jobs:
  plan:
    # A schedule always runs on the default branch; a manual run must be
    # from main too, the only ref the plan role trusts outside a pull
    # request.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_READ }}
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PAGES }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.2"
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # layers.tf zips the fpcalc layer from build/, which is not committed.
      - name: fetch fpcalc
        run: python3 scripts/fetch_fpcalc.py

      - name: init
        run: terraform init

      - name: GitHub token (read)
        id: github-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.INFRA_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.INFRA_READ_APP_PRIVATE_KEY }}
          owner: mini-app-polis

      # -detailed-exitcode: 0 no changes, 2 changes (drift), 1 error.
      # Both 1 and 2 fail the run.
      - name: plan
        env:
          GITHUB_TOKEN: ${{ steps.github-token.outputs.token }}
        run: |
          set +e
          terraform plan -lock=false -no-color -detailed-exitcode > plan.txt
          code=$?
          set -e
          cat plan.txt
          if [ "$code" -eq 2 ]; then
            echo "::error::Drift: main's configuration differs from what is deployed. Find the hand change in the plan, then revert it or declare it."
          fi
          exit "$code"

      - name: summary
        if: always()
        run: |
          [ -f plan.txt ] || exit 0
          {
            echo "## terraform drift plan"
            echo
            grep -E '^(Plan:|No changes\.|Error)' plan.txt || true
            echo
            echo '<details><summary>Full plan</summary>'
            echo
            echo '```'
            head -c 60000 plan.txt
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
