# Plan on every pull request; plan and apply on every merge to main, or on
# a manual run from main (Actions → terraform → Run workflow).
#
#   pull request → plan      infra-plan (read-only), -lock=false; the plan
#                            is the job summary
#   push to main → plan      the same, from main
#                → apply     infra-apply, in the `production` environment
#                            (main only): plans again under the lock and
#                            applies. The merge is the approval.
#
# Nothing applies from dev, and main accepts changes only by pull request,
# so main is what is applied. After each merge, sync-dev fast-forwards dev
# to main. See ci.tf for the roles.
#
# Plans carry no secrets: the Doppler token reads only the Pages sites'
# public build values (cloudflare_pages_sites.tf), and the one sensitive
# value read (the alert address) prints as (sensitive). No plan file is
# uploaded as an artifact: artifacts on a public repository are
# downloadable, and a saved plan holds sensitive values in the clear.

name: terraform

on:
  pull_request:
    branches: [main]
    # labeled/unlabeled: adding or removing allow-destroy re-runs the check.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  # Re-apply main by hand, e.g. after a Doppler change: Terraform reads the
  # Pages build variables from Doppler only when it runs, so a new value
  # reaches Pages on the next apply, not when it is saved in Doppler.
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  AWS_REGION: us-east-1

jobs:
  plan:
    runs-on: ubuntu-latest
    # Read-only: a pull request's plan can see Cloudflare but change nothing.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_READ }}
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PAGES }}
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7

      # Constants this configuration copies from the repositories that own
      # them, read from their main: main is what they release, and this
      # applies on merge to main. A coordinated change lands in the owner's
      # main first; until it has, these fail and the copy here waits.
      - name: check out api-kaianolevine-com's dispatch claims and metrics routes
        uses: actions/checkout@v7
        with:
          repository: mini-app-polis/api-kaianolevine-com
          ref: main
          path: upstream/api-kaianolevine-com
          sparse-checkout: |
            src/kaianolevine_api/services/dispatch_claims.py
            src/kaianolevine_api/main.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: claim window matches the API's CLAIM_WINDOW
        run: python3 scripts/check_claim_window.py upstream/api-kaianolevine-com/src/kaianolevine_api/services/dispatch_claims.py

      - name: check out watcher-cog's watchers
        uses: actions/checkout@v7
        with:
          repository: mini-app-polis/watcher-cog
          ref: main
          path: upstream/watcher-cog
          sparse-checkout: src/watcher_cog/config.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: scheduled watchers are ones watcher-cog publishes
        run: python3 scripts/check_watcher_names.py upstream/watcher-cog/src/watcher_cog/config.py

      - name: check out api-deejaytools' metrics routes
        uses: actions/checkout@v7
        with:
          repository: mini-app-polis/api-deejaytools
          ref: main
          path: upstream/api-deejaytools
          sparse-checkout: src/api_deejaytools/main.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: dashboard routes are ones their APIs publish
        run: python3 scripts/check_api_routes.py upstream/api-kaianolevine-com/src/kaianolevine_api/main.py upstream/api-deejaytools/src/api_deejaytools/main.py

      - name: check out rotator-cog's secrets inventory
        uses: actions/checkout@v7
        with:
          repository: mini-app-polis/rotator-cog
          ref: main
          path: upstream/rotator-cog
          sparse-checkout: secrets/inventory.yaml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: the rotator's IAM users are the ones its inventory rotates
        run: python3 scripts/check_rotator_iam_users.py upstream/rotator-cog/secrets/inventory.yaml

      - uses: hashicorp/setup-terraform@v4
        with:
          # Match the workstation, so fmt agrees and the state's version
          # does not move under it.
          terraform_version: "1.16.2"
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: fmt
        run: terraform fmt -check -recursive -diff

      - name: init
        run: terraform init

      - name: validate
        run: terraform validate

      # -lock=false: a plan changes nothing, and the plan role cannot write
      # the lock file. -detailed-exitcode: 0 no changes, 2 changes, 1 error.
      - name: plan
        id: plan
        run: |
          set +e
          terraform plan -lock=false -no-color -detailed-exitcode -out tfplan > plan.txt
          code=$?
          set -e
          cat plan.txt
          if [ "$code" -eq 1 ]; then exit 1; fi
          echo "changes=$([ "$code" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # A plan that destroys or replaces anything does not merge unless the
      # pull request is labelled allow-destroy. Those are the changes that
      # cause outages — a queue and its messages, a worker reset to the
      # bootstrap placeholder, the producer user and the key the API
      # enqueues with — so they take a deliberate decision, made on the pull
      # request where the plan is read. Unlabelled, they are a mistake and
      # this check stops them.
      - name: refuse unlabelled destroys
        if: steps.plan.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          terraform show -json tfplan \
            | jq -r '.resource_changes[] | select(.change.actions | index("delete")) | "\(.change.actions | join("/"))  \(.address)"' \
            > destroys.txt
          [ -s destroys.txt ] || exit 0

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            labels="$PR_LABELS"
          else
            labels=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].labels[].name' | tr '\n' ' ')
          fi

          if [[ " $labels " == *" allow-destroy "* ]]; then
            echo "::warning::This plan destroys or replaces resources; allowed by the allow-destroy label."
            heading="## ⚠️ Destroys or replacements — allowed by allow-destroy"
            code=0
          else
            echo "::error::This plan destroys or replaces resources. If that is intended, label the pull request allow-destroy."
            heading="## ⛔ Destroys or replacements — label the pull request allow-destroy to allow them"
            code=1
          fi
          cat destroys.txt
          { echo "$heading"; echo '```'; cat destroys.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: summary
        if: always()
        run: |
          # Nothing to summarise when the job failed before planning.
          [ -f plan.txt ] || exit 0
          {
            echo "## terraform plan"
            echo
            grep -E '^(Plan:|No changes\.|Error)' plan.txt || true
            echo
            echo '<details><summary>Full plan</summary>'
            echo
            echo '```'
            head -c 60000 plan.txt
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
    outputs:
      changes: ${{ steps.plan.outputs.changes }}

  apply:
    needs: plan
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.plan.outputs.changes == 'true'
    runs-on: ubuntu-latest
    # Main-only deployment is set on the environment in the repository's
    # settings; the apply role trusts this environment and nothing else.
    environment: production
    # One apply at a time against the one state, and never cancelled
    # midway. On this job only: plans take no lock and change nothing, so
    # a running apply must not hold up the plan on the next pull request.
    concurrency:
      group: terraform-apply
      cancel-in-progress: false
    # Edit token, held as a `production` environment secret so no other job
    # can read it.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PAGES }}
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.2"
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: init
        run: terraform init

      # Planned again under the lock rather than applying the plan job's
      # file: the file never leaves that job (see the header). If anything
      # changed since that plan, this one shows it in the log.
      - name: apply
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          terraform plan -no-color -out tfplan
          # The same guard, on the plan actually applied — main's can differ
          # from the pull request's — against the label on the pull request
          # this merge came from.
          destroys=$(terraform show -json tfplan \
            | jq -r '.resource_changes[] | select(.change.actions | index("delete")) | "\(.change.actions | join("/"))  \(.address)"')
          if [ -n "$destroys" ]; then
            labels=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].labels[].name' | tr '\n' ' ')
            if [[ " $labels " != *" allow-destroy "* ]]; then
              echo "::error::Refusing to apply unlabelled destroys or replacements:"
              echo "$destroys"
              exit 1
            fi
            echo "::warning::Applying destroys or replacements allowed by allow-destroy:"
            echo "$destroys"
          fi
          terraform apply -no-color tfplan

  # SEC-001/002/004: secret scanning (gating) and static analysis
  # (advisory — semgrep's auto config includes Terraform rules), from the
  # fleet's shared workflow. Its dependency audits are for Python and
  # TypeScript and skip here; Dependabot keeps the providers and actions
  # current (SEC-007).
  security:
    uses: mini-app-polis/.github/.github/workflows/security.yml@v3
    with:
      language: terraform
    permissions:
      contents: read

  # CD-031: ask for this repository's own evaluation once main has been
  # applied — or had nothing to apply, since a change to the workflow or
  # the configuration still changes what the evaluator grades. Not after a
  # failed apply: that needs fixing first, and a red apply job already
  # says so.
  evaluate:
    needs: [plan, apply]
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.plan.result == 'success'
      && (needs.apply.result == 'success' || needs.apply.result == 'skipped')
    uses: mini-app-polis/.github/.github/workflows/evaluate.yml@v3
    secrets:
      api-key: ${{ secrets.CI_VALIDATOR_API_KEY }}

  # After a merge, main is dev plus a merge commit. Move dev up to it so the
  # next pull request starts from what main holds. A plain push: if dev has
  # gained commits main does not have, it is not a fast-forward, the push
  # is refused, and this job fails rather than discarding them.
  sync-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: fast-forward dev to main
        run: git push origin HEAD:refs/heads/dev
